name: Tests

# The repo had no CI: a PR's empty checks list looked the same as "all green".
# The suite is plain node:test with no dependencies, so this is the whole job.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  node-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: node --test
        run: node --test "tests/**/*.test.js"
